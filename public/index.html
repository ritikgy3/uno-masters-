<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>UNO Masters • Online Multiplayer</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#050b08;
  --green:#0b3d24;
  --green2:#17633a;
  --panel:#101b17;
  --panel2:#14231d;
  --line:#34483d;
  --gold:#f6d365;
  --gold2:#c99b2e;
  --text:#f7f8f4;
  --muted:#9daea4;
  --red:#e3283d;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% 42%,#17633a 0,#0c3d25 34%,#061a10 65%,#020604 100%);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  padding:13px 18px;
  background:rgba(5,10,8,.94);
  border-bottom:1px solid #5b4920;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(12px);
}

.logo{
  font-size:18px;
  font-weight:950;
  letter-spacing:.2px;
}

.logo span{
  color:var(--gold);
}

.connection{
  font-size:12px;
  font-weight:800;
}

.online{
  color:#67e8a5;
}

.offline{
  color:#ff6e7d;
}

/* MAIN */

main{
  width:100%;
  max-width:1100px;
  margin:auto;
  padding:14px;
}

.panel{
  background:
    linear-gradient(145deg,
      rgba(20,35,29,.97),
      rgba(9,18,14,.97));
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:
    0 14px 35px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.hidden{
  display:none!important;
}

/* LOBBY */

.lobby-logo{
  text-align:center;
  padding:18px 10px 10px;
}

.lobby-logo .uno-symbol{
  width:120px;
  height:70px;
  margin:auto;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 30%,#ff626d,#dc2638 52%,#810d1d);
  border:4px solid var(--gold);
  box-shadow:
    0 0 0 3px #351016,
    0 12px 30px #0009;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(-8deg);
}

.lobby-logo .uno-symbol b{
  font-size:35px;
  font-weight:1000;
  letter-spacing:-3px;
  text-shadow:0 3px 4px #0009;
}

.lobby-title{
  margin:16px 0 3px;
  font-size:30px;
  font-weight:1000;
  letter-spacing:-1px;
  color:#f8f4df;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
}

input,button{
  font:inherit;
}

input{
  flex:1;
  min-width:140px;
  padding:12px 13px;
  border-radius:11px;
  border:1px solid #3b5145;
  background:#07100c;
  color:white;
  outline:none;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 2px #f6d36522;
}

button{
  padding:11px 14px;
  border-radius:11px;
  border:1px solid #3b5145;
  background:#18271f;
  color:white;
  font-weight:850;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.12);
}

button:active{
  transform:scale(.96);
}

.primary{
  background:
    linear-gradient(145deg,#ffe98b,#e1b43f,#b47e1d);
  color:#201709;
  border:1px solid #fff0a4;
  box-shadow:0 5px 15px #0006;
}

.small{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

.message{
  min-height:22px;
  color:var(--gold);
  font-size:13px;
  font-weight:800;
  text-align:center;
}

/* GAME TOP */

.gamebar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.room-code{
  color:var(--gold);
  font-size:18px;
  font-weight:1000;
  letter-spacing:2px;
}

/* PLAYERS */

.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.player{
  padding:10px;
  border-radius:13px;
  background:#ffffff07;
  border:1px solid #2d4438;
  min-width:0;
}

.player.active{
  border-color:var(--gold);
  box-shadow:
    0 0 0 1px #f6d36533,
    0 0 20px #f6d36518;
}

.player-name{
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.player-info{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.turn{
  color:var(--gold);
  font-weight:900;
}

/* TABLE */

.table{
  position:relative;
  min-height:430px;
  overflow:hidden;
  border-radius:22px;
  border:3px solid #5c4316;

  background:
    radial-gradient(
      ellipse at center,
      #19703f 0,
      #0f4b2c 38%,
      #082b1a 70%,
      #04150c 100%
    );

  box-shadow:
    inset 0 0 80px #0009,
    0 18px 45px #0009;
}

.table:before{
  content:"";
  position:absolute;
  inset:14px;
  border:1px solid rgba(246,211,101,.15);
  border-radius:18px;
  pointer-events:none;
}

.table-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-8deg);
  font-size:70px;
  font-weight:1000;
  letter-spacing:-6px;
  color:#fff;
  opacity:.055;
  pointer-events:none;
  user-select:none;
}

.table-content{
  position:relative;
  z-index:2;
  padding:15px;
}

.table-info{
  display:flex;
  justify-content:space-between;
  gap:8px;
  flex-wrap:wrap;
}

.info-badge{
  background:#06140de8;
  border:1px solid #b9973e55;
  padding:8px 11px;
  border-radius:10px;
  font-size:11px;
  font-weight:800;
}

.center{
  min-height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
}

/* CARDS */

.pile,
.card{
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  user-select:none;
}

.pile{
  width:82px;
  height:116px;
  border-radius:14px;
  border:3px solid #fff;
  box-shadow:0 10px 23px #0009;
}

.draw-pile{
  background:
    repeating-linear-gradient(
      45deg,
      #112b88 0,
      #112b88 7px,
      #f1f3fa 8px,
      #112b88 10px,
      #112b88 16px
    );
  position:relative;
}

.draw-pile:after{
  content:"UNO";
  position:absolute;
  font-size:18px;
  color:white;
  background:#d51d32;
  padding:7px 9px;
  border-radius:50%;
  transform:rotate(-12deg);
  border:2px solid white;
  box-shadow:0 2px 5px #0009;
}

.top-card{
  font-size:24px;
  text-shadow:0 2px 3px #0009;
}

/* CARD COLORS */

.red{
  background:linear-gradient(145deg,#ff5968,#a50d28);
}

.yellow{
  background:linear-gradient(145deg,#ffe66b,#c99705);
  color:#201600;
  text-shadow:none;
}

.green{
  background:linear-gradient(145deg,#39d989,#087044);
}

.blue{
  background:linear-gradient(145deg,#5d8fff,#173ca5);
}

.wild{
  background:
    conic-gradient(
      from 45deg,
      #e64646,
      #f0c53d,
      #2ab56d,
      #3d79ed,
      #e64646
    );
}

.card{
  width:62px;
  height:90px;
  border:3px solid white;
  border-radius:13px;
  color:white;
  position:relative;
  overflow:hidden;
  font-size:20px;
  text-shadow:0 2px 3px #0009;
  box-shadow:0 8px 18px #0008;
  transition:
    transform .14s,
    box-shadow .14s;
  flex:0 0 auto;
}

.card:before{
  content:"";
  position:absolute;
  width:58px;
  height:58px;
  background:#ffffff25;
  border-radius:50%;
  transform:rotate(-28deg) scaleX(1.45);
}

.card:after{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid #ffffff55;
  border-radius:10px;
}

.card span{
  position:relative;
  z-index:2;
}

.card:hover{
  transform:translateY(-8px) rotate(-1deg);
  box-shadow:0 16px 27px #000b;
}

/* HAND */

.hand-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.hand{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:12px 5px 8px;
  justify-content:center;
  min-height:105px;
}

.hand .card{
  cursor:pointer;
}

.card.disabled{
  opacity:.38;
  cursor:not-allowed;
}

.card.disabled:hover{
  transform:none;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-top:8px;
}

.draw-button{
  min-width:100px;
  min-height:60px;
  background:
    linear-gradient(145deg,#1b2b22,#07100c);
  border:1px solid var(--gold2);
  color:#f5d878;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.draw-button small{
  font-size:9px;
  opacity:.7;
}

.uno-button{
  width:82px;
  height:82px;
  padding:4px;
  border-radius:50%;
  background:
    radial-gradient(circle at 35% 25%,
      #ff6b72,
      #d41e35 55%,
      #720916);
  border:3px solid #f4d46b;
  box-shadow:
    0 0 0 3px #4d171d,
    0 8px 20px #000b;
  color:white;
  font-size:13px;
  letter-spacing:1px;
}

.uno-button:active{
  transform:scale(.92);
}

/* WINNER */

.winner{
  text-align:center;
  color:var(--gold);
  font-size:22px;
  font-weight:1000;
  min-height:30px;
}

/* RESPONSIVE */

@media(max-width:760px){
  .players{
    grid-template-columns:repeat(2,1fr);
  }

  .table{
    min-height:390px;
  }

  .center{
    min-height:220px;
    gap:15px;
  }

  .pile{
    width:70px;
    height:100px;
  }

  .card{
    width:55px;
    height:82px;
    font-size:17px;
  }

  .hand{
    justify-content:flex-start;
  }

  .lobby-title{
    font-size:25px;
  }
}

@media(max-width:390px){
  main{
    padding:8px;
  }

  header{
    padding:12px;
  }

  .logo{
    font-size:15px;
  }

  .card{
    width:49px;
    height:74px;
    font-size:15px;
  }

  .table{
    min-height:360px;
  }

  .center{
    min-height:195px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🏆 UNO <span>Masters</span> • Online</div>
  <div id="connection" class="connection offline">● Connecting...</div>
</header>

<main>

<!-- ================= LOBBY ================= -->

<section id="lobby" class="panel">

  <div class="lobby-logo">
    <div class="uno-symbol">
      <b>UNO</b>
    </div>

    <div class="lobby-title">UNO MASTERS</div>

    <div class="subtitle">
      Online Multiplayer Card Arena
    </div>
  </div>

  <div class="panel">

    <div class="row">
      <input
        id="name"
        maxlength="18"
        placeholder="Enter your name"
        autocomplete="off"
      >

      <button
        class="primary"
        onclick="createRoom()"
      >
        Create Room
      </button>
    </div>

    <br>

    <div class="row">
      <input
        id="code"
        maxlength="6"
        placeholder="6-digit room code"
        autocomplete="off"
      >

      <button onclick="joinRoom()">
        Join Room
      </button>
    </div>

    <p class="small">
      Create a room and share the code with your friends.
      Games support 2–6 players or exactly 8 players.
    </p>

    <div id="lobbyMessage" class="message"></div>

  </div>

</section>


<!-- ================= GAME ================= -->

<section id="game" class="hidden">

  <!-- ROOM BAR -->

  <div class="panel">

    <div class="gamebar">

      <div>
        <span class="small">ROOM</span><br>
        <span id="roomCode" class="room-code">------</span>
      </div>

      <div class="row">

        <button onclick="copyRoom()">
          Copy Code
        </button>

        <button
          id="startButton"
          class="primary"
          onclick="startGame()"
        >
          Start Game
        </button>

      </div>

    </div>

    <div id="notice" class="message"></div>

  </div>


  <!-- PLAYERS -->

  <div class="panel">

    <div class="players" id="players"></div>

  </div>


  <!-- TABLE -->

  <div class="panel">

    <div class="table">

      <div class="table-logo">
        UNO
      </div>

      <div class="table-content">

        <div class="table-info">

          <div class="info-badge">
            TURN:
            <span id="turn">Waiting</span>
          </div>

          <div class="info-badge">
            DECK:
            <span id="deckCount">0</span>
          </div>

          <div class="info-badge">
            COLOR:
            <span id="currentColor">—</span>
          </div>

        </div>


        <div class="center">

          <div
            id="drawPile"
            class="pile draw-pile"
          ></div>

          <div
            id="topCard"
            class="pile top-card"
          >
            —
          </div>

        </div>


        <div id="winner" class="winner"></div>


        <div class="controls">

          <button
            class="draw-button"
            onclick="drawCard()"
          >
            <span>DRAW</span>
            <small>CARD</small>
          </button>

          <button
            class="uno-button"
            onclick="callUno()"
          >
            UNO!
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- HAND -->

  <div class="panel">

    <div class="hand-title">
      <b>YOUR HAND</b>
      <span id="handCount" class="small">0 cards</span>
    </div>

    <div
      id="hand"
      class="hand"
    ></div>

  </div>

</section>

</main>


<script>

/* =========================================================
   UNO MASTERS — MULTIPLAYER CLIENT
   Compatible with current server.js
========================================================= */

let ws = null;
let myId = null;
let roomCode = null;
let state = null;
let myHand = [];


/* ================= DOM ================= */

const $ = id => document.getElementById(id);


/* ================= CONNECTION ================= */

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss"
      : "ws";

  const url =
    protocol + "://" + location.host;

  ws = new WebSocket(url);

  ws.onopen = () => {

    $("connection").textContent =
      "● Online";

    $("connection").className =
      "connection online";

  };

  ws.onclose = () => {

    $("connection").textContent =
      "● Disconnected";

    $("connection").className =
      "connection offline";

    setTimeout(connect,3000);

  };

  ws.onerror = () => {

    $("connection").textContent =
      "● Connection Error";

    $("connection").className =
      "connection offline";

  };

  ws.onmessage = event => {

    let message;

    try{
      message = JSON.parse(event.data);
    }
    catch{
      return;
    }

    handleMessage(message);

  };

}


/* ================= SEND ================= */

function send(message){

  if(
    ws &&
    ws.readyState === WebSocket.OPEN
  ){

    ws.send(JSON.stringify(message));

  }

}


/* ================= NAME ================= */

function playerName(){

  const value =
    $("name").value.trim();

  return value || "Player";

}


/* ================= CREATE ================= */

function createRoom(){

  if(
    !ws ||
    ws.readyState !== WebSocket.OPEN
  ){

    $("lobbyMessage").textContent =
      "Connecting to server...";

    return;

  }

  send({
    type:"create",
    name:playerName()
  });

}


/* ================= JOIN ================= */

function joinRoom(){

  const code =
    $("code").value
      .trim()
      .toUpperCase();

  if(code.length !== 6){

    $("lobbyMessage").textContent =
      "Enter the 6-digit room code.";

    return;

  }

  send({
    type:"join",
    name:playerName(),
    code:code
  });

}


/* ================= START ================= */

function startGame(){

  send({
    type:"start"
  });

}


/* ================= DRAW ================= */

function drawCard(){

  send({
    type:"draw"
  });

}


/* ================= UNO ================= */

function callUno(){

  send({
    type:"uno"
  });

}


/* ================= MESSAGE HANDLER ================= */

function handleMessage(message){

  if(message.type === "joined"){

    myId = message.id;
    roomCode = message.code;

    $("roomCode").textContent =
      roomCode;

    $("lobby").classList.add("hidden");
    $("game").classList.remove("hidden");

    $("lobbyMessage").textContent = "";

    $("notice").textContent =
      "Room joined successfully.";

    return;

  }


  if(message.type === "state"){

    state = message;

    renderState();

    return;

  }


  if(message.type === "hand"){

    myHand =
      Array.isArray(message.hand)
        ? message.hand
        : [];

    renderHand();

    return;

  }


  if(message.type === "error"){

    $("notice").textContent =
      "⚠️ " + message.message;

    return;

  }


  if(message.type === "notice"){

    $("notice").textContent =
      message.message;

  }

}


/* ================= STATE RENDER ================= */

function renderState(){

  if(!state)
    return;


  $("roomCode").textContent =
    state.room || roomCode || "------";


  $("deckCount").textContent =
    state.deckCount ?? 0;


  /* COLOR */

  const colorNames = {

    red:"🔴 RED",
    yellow:"🟡 YELLOW",
    green:"🟢 GREEN",
    blue:"🔵 BLUE"

  };

  $("currentColor").textContent =
    colorNames[state.color] || "—";


  /* PLAYERS */

  const players =
    state.players || [];

  $("players").innerHTML = "";

  players.forEach((player,index)=>{

    const div =
      document.createElement("div");

    div.className =
      "player" +
      (
        index === state.current &&
        state.started
          ? " active"
          : ""
      );

    const turnText =
      index === state.current &&
      state.started
        ? `<span class="turn"> • YOUR TURN</span>`
        : "";

    div.innerHTML = `

      <div class="player-name">
        ${escapeHTML(player.name)}
        ${player.id === myId ? " (You)" : ""}
      </div>

      <div class="player-info">
        ${player.count} cards
        ${player.connected ? " 🟢" : " ⚪"}
        ${turnText}
      </div>

    `;

    $("players").appendChild(div);

  });


  /* TURN */

  const currentPlayer =
    players[state.current];

  $("turn").textContent =
    currentPlayer
      ? currentPlayer.name
      : "Waiting";


  /* START BUTTON */

  const myIndex =
    players.findIndex(
      player => player.id === myId
    );

  const canStart =
    !state.started &&
    myIndex === 0 &&
    players.length >= 2 &&
    players.length !== 7;

  $("startButton").classList.toggle(
    "hidden",
    !canStart
  );


  /* TOP CARD */

  if(state.top){

    const top =
      state.top;

    const topCard =
      $("topCard");

    topCard.className =
      "pile top-card " +
      (top.c || "");

    const text =
      cardText(top.v);

    topCard.innerHTML =
      `<span>${text}</span>`;

  }
  else{

    $("topCard").className =
      "pile top-card";

    $("topCard").innerHTML =
      "—";

  }


  /* WINNER */

  $("winner").textContent =
    state.winner
      ? "🏆 " + state.winner + " WINS!"
      : "";

}


/* ================= HAND ================= */

function renderHand(){

  $("hand").innerHTML = "";

  $("handCount").textContent =
    myHand.length +
    (myHand.length === 1 ? " card" : " cards");


  if(!state || !state.started)
    return;


  const players =
    state.players || [];

  const currentPlayer =
    players[state.current];


  const myTurn =
    currentPlayer &&
    currentPlayer.id === myId;


  myHand.forEach((card,index)=>{

    const button =
      document.createElement("button");

    button.className =
      "card " +
      (card.c || "");


    /*
      Only disable cards when it isn't
      your turn.

      The server performs the actual
      legality check.
    */

    if(!myTurn){

      button.classList.add("disabled");

    }


    button.innerHTML =
      `<span>${cardText(card.v)}</span>`;


    button.onclick = () => {

      if(!myTurn)
        return;

      playCard(index,card);

    };


    $("hand").appendChild(button);

  });

}


/* ================= PLAY CARD ================= */

function playCard(index,card){

  if(!card)
    return;


  /* WILD COLOR */

  if(card.c === "wild"){

    let selected =
      prompt(
        "Choose color:\nred, yellow, green or blue",
        "red"
      );


    if(!selected)
      return;


    selected =
      selected.trim().toLowerCase();


    const allowed =
      ["red","yellow","green","blue"];


    if(!allowed.includes(selected)){

      alert(
        "Please choose: red, yellow, green or blue."
      );

      return;

    }


    send({

      type:"play",
      index:index,
      color:selected

    });

    return;

  }


  /* NORMAL CARD */

  send({

    type:"play",
    index:index

  });

}


/* ================= CARD TEXT ================= */

function cardText(value){

  const labels = {

    REV:"↔",

    SKIP:"SKIP",

    DRAW2:"+2",

    DRAW4:"+4",

    WILD:"WILD"

  };

  return labels[value] ??
         escapeHTML(value);

}


/* ================= COPY ROOM ================= */

function copyRoom(){

  if(!roomCode)
    return;


  if(navigator.clipboard){

    navigator.clipboard
      .writeText(roomCode)
      .then(()=>{

        $("notice").textContent =
          "Room code copied: " + roomCode;

      });

  }
  else{

    $("notice").textContent =
      "Room code: " + roomCode;

  }

}


/* ================= SECURITY ================= */

function escapeHTML(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      character => ({

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"

      })[character]
    );

}


/* ================= START ================= */

connect();
