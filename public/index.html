<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNO Masters • Online Multiplayer</title><style>
*{box-sizing:border-box}
:root{--bg:#070914;--panel:#111525;--line:#2a3150;--gold:#f6c453;--text:#f7f8ff;--muted:#9ba4c2}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:
radial-gradient(circle at 50% 45%,#123b24 0,#071d13 48%,#05070c 85%);color:var(--text);min-height:100vh}
header{padding:14px 18px;background:#090c19eF;border-bottom:1px solid #303753;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
header b{font-size:17px;letter-spacing:.2px}.online{color:#67e8a5}.offline{color:#ff7d88}
main{max-width:1050px;margin:auto;padding:14px}
.panel{background:linear-gradient(145deg,#151a2d,#0f1322);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 14px 35px #0005}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,button{padding:11px 13px;border-radius:11px;border:1px solid #323a5a;font-size:15px}
input{flex:1;min-width:130px;background:#0a0e1b;color:white;outline:none}
input:focus{border-color:var(--gold)}button{font-weight:800;cursor:pointer;background:#202741;color:white}
button:hover{filter:brightness(1.12)}.primary{background:linear-gradient(135deg,#ffd86a,#d99b25);color:#17120a;border:0}
.players{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pl{padding:10px;border-radius:12px;background:#ffffff07;border:1px solid #2a3150}
.active{border-color:var(--gold);box-shadow:0 0 0 1px #f6c45344,0 0 18px #f6c45322}
.center{display:flex;justify-content:center;gap:22px;align-items:center;min-height:240px}
.table-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:72px;font-weight:950;letter-spacing:-5px;color:#f5f5f5;opacity:.09;pointer-events:none;user-select:none;text-transform:lowercase;text-shadow:0 2px 12px #000}
.pile,.card{border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:900;box-shadow:0 10px 22px #0008}
.pile{width:82px;height:116px;border:2px solid #fff}
.back{background:linear-gradient(145deg,#0a2918,#174f2c);position:relative;overflow:hidden;border-color:#d9b84e}.back:after{content:"one8";font-size:24px;letter-spacing:-2px;color:#e8c85d;opacity:.95;text-shadow:0 0 12px #d8ad36}
.status{text-align:center;min-height:25px;font-weight:800;color:#f5d878}
.draw-btn{min-width:92px;min-height:58px;background:linear-gradient(145deg,#17231d,#0a0f0d);border:1px solid #cfa943;color:#f5d878;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.draw-btn small{font-size:10px;opacity:.75}.uno-btn{width:86px;height:86px;border-radius:50%;padding:5px;background:radial-gradient(circle at 35% 25%,#ff6464,#d51d32 55%,#6e0817);border:3px solid #f4d46b;box-shadow:0 0 0 3px #4c1b1e,0 8px 18px #000b;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.uno-btn img{width:100%;height:100%;object-fit:cover;border-radius:50%;opacity:.82}.uno-btn span{position:absolute;bottom:5px;left:0;right:0;color:#fff;font-size:12px;font-weight:1000;letter-spacing:1px;text-shadow:0 2px 3px #000}.uno-btn:active{transform:scale(.94)}
.hidden{display:none}.small{opacity:.72;font-size:12px}
.hand{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;padding:12px 0 5px}
.card{width:64px;height:92px;color:#fff;border:3px solid #fff;position:relative;overflow:hidden;text-shadow:0 2px 3px #0008;transition:transform .14s,box-shadow .14s}
.card:before{content:"";position:absolute;width:58px;height:58px;background:#ffffff30;border-radius:50%;transform:rotate(-28deg) scaleX(1.45);filter:blur(.3px)}
.card:after{content:"";position:absolute;inset:5px;border:1px solid #ffffff55;border-radius:10px;pointer-events:none}
.card{font-size:21px}.card:hover{transform:translateY(-7px) rotate(-1deg);box-shadow:0 16px 26px #000b}
.card.red{background:linear-gradient(145deg,#ff5b66,#a90e2a)}
.card.yellow{background:linear-gradient(145deg,#ffe56b,#d39a05);color:#201600;text-shadow:none}
.card.green{background:linear-gradient(145deg,#39d889,#087044)}
.card.blue{background:linear-gradient(145deg,#5c8dff,#173da9)}
.card.wild{background:conic-gradient(from 45deg,#e64646,#f2c744,#2ab56d,#3d79ed,#e64646)}
.card[disabled]{opacity:.38;transform:none;cursor:not-allowed}
.card:disabled:hover{box-shadow:0 10px 22px #0008}
.card::first-letter{font-size:inherit}
@media(max-width:760px){.players{grid-template-columns:repeat(2,1fr)}.card{width:55px;height:82px;font-size:18px}.center{min-height:210px}.pile{width:72px;height:104px}}
@media(max-width:390px){main{padding:9px}.card{width:48px;height:73px;font-size:16px}.hand{gap:6px}}
</style></head>
<body><header><b>🏆 UNO Masters • Online</b><span id="conn">Offline</span></header><main>
<section id="lobby" class="panel"><h2>Join a Room</h2><div class="row"><input id="name" placeholder="Your name"><button class="primary" onclick="create()">Create Room</button></div><br><div class="row"><input id="code" placeholder="6-digit room code" maxlength="6"><button onclick="join()">Join Room</button></div><p class="small">Share the room code with up to 7 other players. 7-player games cannot start; use 2–6 or exactly 8 players.</p></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><b>Room: <span id="room"></span></b><button onclick="copyCode()">Copy code</button><button id="start" class="primary" onclick="send({type:'start'})">Start</button></div></div>
<div class="panel"><div class="players" id="players"></div></div>
<div class="panel"><div class="center"><div class="table-logo" aria-label="one8">one8</div><div class="pile back">DRAW</div><div id="top" class="pile">—</div></div><div class="status" id="status"></div>
<div class="row" style="justify-content:center;margin:10px">
<button class="draw-btn" onclick="send({type:'draw'})"><span>DRAW</span><small>CARD</small></button>
<button class="uno-btn" onclick="send({type:'uno'})"><img src="one8-uno-image.png" alt="UNO"><span>UNO</span></button>
</div><div class="hand" id="hand"></div></div></section>
</main><script>
let ws,state,myId;
function connect(){ws=new WebSocket(location.origin.replace(/^http/,'ws'));ws.onopen=()=>conn.textContent="● Online";conn.className="online";ws.onclose=()=>conn.textContent="● Disconnected";conn.className="offline";ws.onmessage=e=>handle(JSON.parse(e.data))}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x))}
function name(){return document.getElementById("name").value.trim()||"Player"}
function create(){send({type:"create",name:name()})}function join(){send({type:"join",name:name(),code:document.getElementById("code").value.trim()})}
function handle(m){
 if(m.type==="joined"){myId=m.id;room.textContent=m.code;lobby.classList.add("hidden");game.classList.remove("hidden");}
 if(m.type==="state"){state=m;render()}
 if(m.type==="hand"){renderHand(m.hand)}
 if(m.type==="error")alert(m.message); if(m.type==="notice")status.textContent=m.message;
}
function render(){
 players.innerHTML=state.players.map((p,i)=>`<div class="pl ${i===state.current?'active':''}"><b>${esc(p.name)}</b><br><span class="small">${p.count} cards${p.connected?'':' • offline'} ${i===state.current?' • TURN':''}</span></div>`).join("");
 top.innerHTML=state.top?(state.top.v==="REV"?"↔":state.top.v==="SKIP"?"SKIP":state.top.v==="DRAW2"?"+2":state.top.v==="DRAW4"?"+4":state.top.v==="WILD"?"WILD":state.top.v):"—";top.className="pile "+(state.top?.c||"");
 start.style.display=state.started?"none":"inline-block";start.disabled=state.players.length<2;
 status.textContent=state.winner?`🏆 ${state.winner} wins!`:(state.started?`Current turn: ${state.players[state.current]?.name||""}`:`Waiting for players (${state.players.length}/8)`);
}
function renderHand(hand){let h=document.getElementById("hand");h.innerHTML="";if(!state?.started)return;
 hand.forEach((c,i)=>{
 let b=document.createElement("button");
 b.className="card "+c.c;
 b.innerHTML=c.v==="REV"?"↔":c.v==="SKIP"?"SKIP":c.v==="DRAW2"?"+2":c.v==="DRAW4"?"+4":c.v==="WILD"?"WILD":c.v;
 b.disabled=state.players[state.current]?.id!==myId;
 b.onclick=()=>play(i,c);
 h.appendChild(b)
})
}
function play(i,c){if(c.c==="wild"){let x=prompt("Choose color: red, yellow, green or blue");if(!["red","yellow","green","blue"].includes((x||"").toLowerCase()))return;send({type:"play",index:i,color:x.toLowerCase()})}else send({type:"play",index:i})}
function copyCode(){navigator.clipboard?.writeText(state.room);alert("Room code copied: "+state.room)}
function esc(s){return s.replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]))}
connect();
</script></body></html>
