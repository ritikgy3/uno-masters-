<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>UNO Masters • Online</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green1:#0b3b22;
  --green2:#062719;
  --green3:#03150d;
  --gold:#f5d36a;
  --gold2:#c99b28;
  --cream:#fff5c9;
  --panel:#101827;
  --text:#ffffff;
  --muted:#aeb8c9;
}

html,body{
  margin:0;
  min-height:100%;
  background:#020706;
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 50% 45%,#155b32 0,#08341f 30%,#03170e 65%,#010605 100%);
}

/* ---------- TOP BAR ---------- */

header{
  height:62px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:
    linear-gradient(180deg,#111827f5,#070c14f5);

  border-bottom:1px solid #8f712d;
  box-shadow:0 5px 25px #000b;

  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(14px);
}

.logo-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:950;
  letter-spacing:.2px;
}

.connection{
  font-size:13px;
  font-weight:800;
}

.online{
  color:#68f0a0;
}

.offline{
  color:#ff7582;
}

/* ---------- GENERAL ---------- */

main{
  width:min(1100px,100%);
  margin:auto;
  padding:18px 12px 40px;
}

.hidden{
  display:none!important;
}

.panel{
  background:
    linear-gradient(145deg,#172034f5,#0a101cf5);

  border:1px solid #34415c;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;

  box-shadow:
    0 16px 40px #0009,
    inset 0 1px #ffffff0d;
}

h1,h2,h3,p{
  margin-top:0;
}

h2{
  margin-bottom:15px;
}

.small{
  color:var(--muted);
  font-size:12px;
}

/* ---------- BUTTONS ---------- */

button,
input{
  font:inherit;
}

button{
  border:1px solid #4a5875;
  border-radius:12px;
  padding:11px 15px;

  background:
    linear-gradient(145deg,#28334b,#171f31);

  color:#fff;
  font-weight:850;
  cursor:pointer;

  box-shadow:
    0 5px 12px #0006,
    inset 0 1px #ffffff12;

  transition:.15s ease;
}

button:active{
  transform:translateY(2px) scale(.98);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.primary{
  color:#201605;
  border:1px solid #fff0a1;

  background:
    linear-gradient(145deg,#fff09a 0%,#f5d36a 45%,#b78320 100%);

  box-shadow:
    0 5px 18px #d8a83244,
    inset 0 1px #fff8;
}

input{
  width:100%;
  padding:12px 14px;

  color:#fff;
  background:#060c15;

  border:1px solid #39465f;
  border-radius:12px;
  outline:none;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 2px #f5d36a22;
}

.row{
  display:flex;
  align-items:center;
  gap:9px;
  flex-wrap:wrap;
}

.row input{
  flex:1;
  min-width:150px;
}

/* ---------- LOBBY ---------- */

.lobby-logo{
  text-align:center;
  padding:12px 0 20px;
}

.lobby-logo .trophy{
  font-size:48px;
}

.lobby-logo h1{
  margin:6px 0;
  font-size:32px;
  font-weight:1000;

  background:linear-gradient(#fff7c9,#f5d36a,#b98422);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.lobby-logo p{
  color:#aeb8c9;
}

/* ---------- CASINO TABLE ---------- */

.casino-frame{
  position:relative;

  padding:12px;

  border-radius:28px;

  background:
    linear-gradient(135deg,#d2a746,#714d13 14%,#251807 48%,#9c7528 85%,#d9b451);

  box-shadow:
    0 25px 60px #000c,
    inset 0 2px 3px #fff6,
    inset 0 -3px 5px #000a;
}

.casino-table{
  position:relative;
  overflow:hidden;

  min-height:600px;

  border-radius:20px;

  background:
    radial-gradient(
      ellipse at center,
      #17663a 0%,
      #0d4828 35%,
      #07311d 68%,
      #041c11 100%
    );

  border:3px solid #573e14;

  box-shadow:
    inset 0 0 80px #0008,
    inset 0 0 20px #0009;
}

/* felt texture */

.casino-table:before{
  content:"";
  position:absolute;
  inset:0;

  background:
    repeating-radial-gradient(
      circle at 50% 50%,
      #ffffff05 0,
      #ffffff05 1px,
      transparent 1px,
      transparent 5px
    );

  opacity:.3;
  pointer-events:none;
}

/* center logo */

.center-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  font-size:70px;
  font-weight:1000;
  letter-spacing:-5px;

  color:#fff;
  opacity:.075;

  pointer-events:none;
  user-select:none;
}

/* ---------- ROOM BAR ---------- */

.room-bar{
  position:relative;
  z-index:5;

  margin:13px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;

  padding:11px 13px;

  border-radius:14px;

  background:#07130de6;
  border:1px solid #d4ad4d55;

  box-shadow:0 8px 20px #0005;
}

.room-code{
  color:#ffe58a;
  font-weight:950;
}

/* ---------- PLAYERS ---------- */

.players{
  position:relative;
  z-index:4;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;

  padding:0 13px;
}

.player{
  min-height:66px;

  padding:9px;

  border-radius:13px;

  background:
    linear-gradient(145deg,#162133e8,#0a111be8);

  border:1px solid #59657c;

  box-shadow:
    0 7px 16px #0007,
    inset 0 1px #ffffff0a;
}

.player.active{
  border-color:var(--gold);

  box-shadow:
    0 0 0 1px #f5d36a44,
    0 0 25px #f5d36a33,
    0 7px 18px #0008;
}

.player-name{
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-info{
  margin-top:4px;
  color:#b6c0d0;
  font-size:11px;
}

/* ---------- GAME CENTER ---------- */

.game-center{
  position:relative;
  z-index:3;

  min-height:310px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:28px;
}

.deck-wrap
