<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UNO Masters</title>

<style>
*{box-sizing:border-box}

:root{
  --gold:#f6c453;
  --gold2:#ffdf75;
  --green:#063d25;
  --green2:#0b5b36;
  --dark:#05070b;
  --panel:#0c111b;
  --line:#26344a;
  --white:#f8fafc;
  --muted:#9aa7b8;
}

body{
  margin:0;
  min-height:100vh;
  color:var(--white);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% 35%,#0b6035 0,#06331f 30%,#061a12 52%,#030508 85%);
}

/* HEADER */

header{
  height:66px;
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(3,7,12,.92);
  border-bottom:1px solid #263449;
  position:sticky;
  top:0;
  z-index:20;
  backdrop-filter:blur(15px);
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-badge{
  width:39px;
  height:39px;
  border-radius:50%;
  background:linear-gradient(145deg,#ffdf75,#d89b24);
  color:#171109;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:1000;
  box-shadow:0 0 18px #f6c45344;
}

.logo-text{
  font-size:19px;
  font-weight:950;
  letter-spacing:.3px;
}

.logo-text span{
  color:var(--gold);
}

.connection{
  font-size:13px;
  font-weight:800;
  color:#ff6b75;
}

.connection.online{
  color:#52e49a;
}

/* MAIN */

main{
  width:min(1100px,100%);
  margin:auto;
  padding:18px 14px 30px;
}

.panel{
  background:
    linear-gradient(145deg,rgba(18,28,39,.96),rgba(7,12,20,.96));
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:
    0 18px 45px rgba(0,0,0,.45),
    inset 0 1px rgba(255,255,255,.025);
}

/* LOBBY */

.lobby{
  max-width:600px;
  margin:45px auto;
  text-align:center;
  padding:28px 20px;
}

.lobby-logo{
  width:125px;
  height:125px;
  margin:0 auto 18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 32% 25%,#ff6d72,#dc1d35 55%,#700817);
  border:6px solid #f6d66b;
  box-shadow:
    0 0 0 5px #301317,
    0 20px 45px #000b,
    0 0 30px #e62d4238;
  display:flex;
  justify-content:center;
  align-items:center;
  transform:rotate(-8deg);
}

.lobby-logo span{
  font-size:25px;
  font-weight:1000;
  transform:rotate(8deg);
  text-shadow:0 3px 4px #000;
}

.lobby h1{
  margin:8px 0 4px;
  font-size:34px;
  letter-spacing:-1px;
}

.lobby h1 span{
  color:var(--gold);
}

.subtitle{
  color:var(--muted);
  margin-bottom:25px;
}

/* INPUTS */

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  align-items:center;
}

input{
  flex:1;
  min-width:140px;
  padding:13px 14px;
  border-radius:12px;
  border:1px solid #34445c;
  outline:none;
  background:#050a11;
  color:#fff;
  font-size:15px;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #f6c45316;
}

button{
  border:1px solid #35445b;
  background:linear-gradient(145deg,#1a2637,#101824);
  color:#fff;
  padding:12px 15px;
  border-radius:12px;
  font-weight:850;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.12);
}

button:active{
  transform:scale(.97);
}

.primary{
  color:#171109;
  border:0;
  background:linear-gradient(135deg,#ffe07a,#d89b25);
  box-shadow:0 7px 18px #c38a2730;
}

.small{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

/* GAME TOP */

.game-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.room-code{
  color:var(--gold);
  font-size:18px;
  font-weight:950;
  letter-spacing:2px;
}

/* PLAYERS */

.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.player{
  min-height:68px;
  padding:11px;
  border-radius:13px;
  background:#ffffff05;
  border:1px solid #263449;
  position:relative;
  overflow:hidden;
}

.player.active{
  border-color:var(--gold);
  box-shadow:
    0 0 0 1px #f6c45338,
    0 0 22px #f6c45318;
}

.player.active:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--gold);
}

.player-name{
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-info{
  margin-top:5px;
  font-size:11px;
  color:var(--muted);
}

/* TABLE */

.table{
  position:relative;
  min-height:410px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #245237;
  background:
    radial-gradient(circle at 50% 48%,#08703d 0,#07562f 32%,#064124 58%,#032518 100%);
  box-shadow:
    inset 0 0 70px #0007,
    0 20px 40px #0007;
  display:flex;
  align-items:center;
  justify-content:center;
}

.table:before{
  content:"";
  position:absolute;
  inset:22px;
  border:1px solid #58b67a20;
  border-radius:50%;
}

.table-logo{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-8deg);
  font-size:72px;
  font-weight:1000;
  letter-spacing:-5px;
  color:#fff;
  opacity:.055;
  pointer-events:none;
}

.cards-center{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  position:relative;
  z-index:2;
}

.card{
  width:82px;
  height:116px;
  border-radius:15px;
  border:3px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
  font-size:26px;
  color:#fff;
  text-shadow:0 3px 4px #0009;
  box-shadow:0 15px 30px #000b;
  position:relative;
  overflow:hidden;
}

.card:before{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff3;
  transform:rotate(-25deg) scaleX(1.4);
}

.card:after{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid #fff6;
  border-radius:11px;
}

.card>*{
  position:relative;
  z-index:2;
}

.red{
  background:linear-gradient(145deg,#ff626a,#a50e29);
}

.yellow{
  background:linear-gradient(145deg,#ffe96e,#d39804);
  color:#211800;
  text-shadow:none;
}

.green{
  background:linear-gradient(145deg,#43dc8a,#087044);
}

.blue{
  background:linear-gradient(145deg,#6394ff,#173da8);
}

.wild{
  background:conic-gradient(
    from 45deg,
    #df3944,
    #f2c33d,
    #2db76e,
    #477cf2,
    #df3944
  );
}

.back{
  background:
    radial-gradient(ellipse at center,#113d28 0 34%,transparent 35%),
    linear-gradient(145deg,#071c12,#14562f);
  border-color:#d8bd58;
}

.back:after{
  content:"UNO";
  position:absolute;
  font-size:23px;
  font-weight:1000;
  color:#f2d35d;
  transform:rotate(-10deg);
  text-shadow:0 0 12px #000;
}

/* STATUS */

.status{
  text-align:center;
  padding:13px 5px;
  min-height:46px;
  font-weight:900;
  color:var(--gold2);
}

.turn-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#52e49a;
  border-radius:50%;
  margin-right:6px;
  box-shadow:0 0 10px #52e49a;
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:15px;
  margin-top:12px;
}

.draw-btn{
  min-width:100px;
  height:62px;
  border-color:#cda83d;
  color:#f6d46b;
  background:linear-gradient(145deg,#18251e,#080e0b);
}

.draw-btn small{
  display:block;
  opacity:.65;
  font-size:10px;
  margin-top:2px;
}

.uno-btn{
  width:86px;
  height:86px;
  border-radius:50%;
  padding:0;
  border:4px solid #f3d66c;
  background:
    radial-gradient(circle at 32% 25%,#ff6569,#d51d35 55%,#700918);
  box-shadow:
    0 0 0 4px #40191d,
    0 12px 25px #000b,
    0 0 22px #ff243838;
  display:flex;
  align-items:center;
  justify-content:center;
}

.uno-btn span{
  font-size:19px;
  font-weight:1000;
  letter-spacing:1px;
  text-shadow:0 3px 4px #000;
  transform:rotate(-8deg);
}

/* HAND */

.hand-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:5px;
}

.hand{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:8px;
  padding:15px 5px 7px;
}

.hand .card{
  width:64px;
  height:94px;
  font-size:20px;
  cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}

.hand .card:hover:not(:disabled){
  transform:translateY(-12px);
  box-shadow:0 22px 30px #000c;
}

.hand .card:disabled{
  opacity:.42;
  cursor:not-allowed;
}

/* HIDDEN */

.hidden{
  display:none!important;
}

/* RESPONSIVE */

@media(max-width:760px){
  .players{
    grid-template-columns:repeat(2,1fr);
  }

  .table{
    min-height:340px;
  }

  .card{
    width:72px;
    height:104px;
  }

  .hand .card{
    width:55px;
    height:82px;
    font-size:17px;
  }

  .lobby{
    margin:25px auto;
  }
}

@media(max-width:430px){
  header{
    height:58px;
    padding:0 12px;
  }

  .logo-text{
    font-size:16px;
  }

  main{
    padding:9px;
  }

  .panel{
    border-radius:16px;
    padding:12px;
  }

  .table{
    min-height:300px;
  }

  .cards-center{
    gap:12px;
  }

  .card{
    width:62px;
    height:91px;
    font-size:21px;
  }

  .table-logo{
    font-size:50px;
  }

  .hand{
    gap:5px;
  }

  .hand .card{
    width:47px;
    height:71px;
    font-size:15px;
    border-width:2px;
  }

  .uno-btn{
    width:72px;
    height:72px;
  }

  .draw-btn{
    min-width:85px;
    height:55px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-badge">8</div>
    <div class="logo-text">UNO <span>Masters</span></div>
  </div>
  <div id="conn" class="connection">● Connecting...</div>
</header>

<main>

<!-- LOBBY -->

<section id="lobby" class="panel lobby">

  <div class="lobby-logo">
    <span>UNO</span>
  </div>

  <h1>UNO <span>Masters</span></h1>
  <div class="subtitle">
    Online Multiplayer Card Battle
  </div>

  <div class="row">
    <input id="name" placeholder="Enter your name" maxlength="18">
    <button class="primary" onclick="createRoom()">Create Room</button>
  </div>

  <div style="height:10px"></div>

  <div class="row">
    <input id="code" placeholder="Enter room code" maxlength="6">
    <button onclick="joinRoom()">Join Room</button>
  </div>

  <p class="small">
    Create a room and share the 6-character code with your friends.
    Supports 2–6 or exactly 8 players.
  </p>

</section>


<!-- GAME -->

<section id="game" class="hidden">

  <div class="panel">
    <div class="game-title">

      <div>
        <span class="small">ROOM</span><br>
        <span id="room" class="room-code">------</span>
      </div>

      <div class="row">
        <button onclick="copyCode()">Copy Code</button>
        <button id="start" class="primary" onclick="send({type:'start'})">
          START GAME
        </button>
      </div>

    </div>
  </div>


  <!-- PLAYERS -->

  <div class="panel">
    <div id="players" class="players"></div>
  </div>


  <!-- TABLE -->

  <div class="panel">
    <div class="table">

      <div class="table-logo">UNO</div>

      <div class="cards-center">

        <div class="card back">
          <span></span>
        </div>

        <div id="top" class="card">
          <span>—</span>
        </div>

      </div>

    </div>

    <div id="status" class="status">
      Waiting for players...
    </div>

    <div class="controls">

      <button class="draw-btn" onclick="send({type:'draw'})">
        DRAW
        <small>CARD</small>
      </button>

      <button class="uno-btn" onclick="send({type:'uno'})">
        <span>UNO!</span>
      </button>

    </div>

  </div>


  <!-- HAND -->

  <div class="panel">

    <div class="hand-title">
      <b>Your Cards</b>
      <span id="cardCount" class="small"></span>
    </div>

    <div id="hand" class="hand"></div>

  </div>

</section>

</main>


<script>

let ws = null;
let state = null;
let myId = null;


/* CONNECT */

function connect(){

  const protocol =
    location.protocol === "https:" ? "wss://" : "ws://";

  ws = new WebSocket(protocol + location.host);

  ws.onopen = () => {

    const el = document.getElementById("conn");

    el.textContent = "● Online";
    el.className = "connection online";

  };

  ws.onclose = () => {

    const el = document.getElementById("conn");

    el.textContent = "● Disconnected";
    el.className = "connection";

  };

  ws.onerror = () => {

    const el = document.getElementById("conn");

    el.textContent = "● Connection Error";
    el.className = "connection";

  };

  ws.onmessage = e => {

    try{
      handle(JSON.parse(e.data));
    }catch(err){
      console.error(err);
    }

  };

}


/* SEND */

function send(message){

  if(ws && ws.readyState === WebSocket.OPEN){

    ws.send(JSON.stringify(message));

  }else{

    alert("Not connected to the game server.");

  }

}


/* PLAYER NAME */

function playerName(){

  const value =
    document.getElementById("name").value.trim();

  return value || "Player";

}


/* CREATE */

function createRoom(){

  send({
    type:"create",
    name:playerName()
  });

}


/* JOIN */

function joinRoom(){

  const code =
    document.getElementById("code").value.trim().toUpperCase();

  if(!code){

    alert("Enter the room code first.");
    return;

  }

  send({
    type:"join",
    name:playerName(),
    code:code
  });

}


/* SERVER MESSAGE */

function handle(m){

  if(m.type === "joined"){

    myId = m.id;

    document.getElementById("room").textContent =
      m.code;

    document.getElementById("lobby")
      .classList.add("hidden");

    document.getElementById("game")
      .classList.remove("hidden");

  }


  if(m.type === "state"){

    state = m;
    render();

  }


  if(m.type === "hand"){

    renderHand(m.hand);

  }


  if(m.type === "notice"){

    document.getElementById("status").textContent =
      m.message;

  }


  if(m.type === "error"){

    alert(m.message);

  }

}


/* RENDER GAME */

function render(){

  if(!state) return;

  const players =
    document.getElementById("players");

  players.innerHTML =
    state.players.map((p,i)=>{

      const active =
        i === state.current;

      return `

        <div class="player ${active ? "active" : ""}">

          <div class="player-name">
            ${escapeHTML(p.name)}
            ${p.id === myId ? " (You)" : ""}
          </div>

          <div class="player-info">
            ${p.count} cards
            ${p.connected ? "" : " • Offline"}
            ${active ? " • YOUR TURN" : ""}
          </div>

        </div>

      `;

    }).join("");


  /* TOP CARD */

  const top =
    document.getElementById("top");

  if(state.top){

    const value = displayValue(state.top.v);

    top.className =
      "card " + (state.top.c || "");

    top.innerHTML =
      `<span>${value}</span>`;

  }else{

    top.className = "card";
    top.innerHTML = "<span>—</span>";

  }


  /* START BUTTON */

  const start =
    document.getElementById("start");

  start.style.display =
    state.started ? "none" : "inline-block";

  start.disabled =
    state.players.length < 2 ||
    state.players.length === 7;


  /* STATUS */

  const status =
    document.getElementById("status");

  if(state.winner){

    status.innerHTML =
      "🏆 " + escapeHTML(state.winner) + " WINS!";

  }

  else if(state.started){

    const current =
      state.players[state.current];

    if(current){

      if(current.id === myId){

        status.innerHTML =
          '<span class="turn-dot"></span> YOUR TURN';

      }else{

        status.textContent =
          "Current turn: " + current.name;

      }

    }

  }

  else{

    status.textContent =
      `Waiting for players (${state.players.length}/8)`;

  }

}


/* HAND */

function renderHand(hand){

  const container =
    document.getElementById("hand");

  const count =
    document.getElementById("cardCount");

  container.innerHTML = "";

  count.textContent =
    hand.length + " cards";


  if(!state || !state.started){

    return;

  }


  hand.forEach((c,i)=>{

    const button =
      document.createElement("button");

    button.className =
      "card " + c.c;

    button.innerHTML =
      `<span>${displayValue(c.v)}</span>`;


    const myTurn =
      state.players[state.current]?.id === myId;

    button.disabled =
      !myTurn;


    button.onclick = () => {

      playCard(i,c);

    };


    container.appendChild(button);

  });

}


/* DISPLAY CARD */

function displayValue(v){

  if(v === "REV") return "↔";
  if(v === "SKIP") return "SKIP";
  if(v === "DRAW2") return "+2";
  if(v === "DRAW4") return "+4";
  if(v === "WILD") return "WILD";

  return v;

}


/* PLAY */

function playCard(index,c){

  if(c.c === "wild"){

    let color =
      prompt(
        "Choose a color:\nred, yellow, green or blue"
      );

    if(!color) return;

    color =
      color.toLowerCase().trim();

    if(!["red","yellow","green","blue"].includes(color)){

      alert("Invalid color.");
      return;

    }

    send({
      type:"play",
      index:index,
      color:color
    });

  }else{

    send({
      type:"play",
      index:index
    });

  }

}


/* COPY ROOM */

function copyCode(){

  if(!state) return;

  const code = state.room;

  if(navigator.clipboard){

    navigator.clipboard.writeText(code)
      .then(()=>{
        alert("Room code copied: " + code);
      });

  }else{

    alert("Room code: " + code);

  }

}


/* ESCAPE */

function escapeHTML(value){

  return String(value)
    .replace(/[&<>"']/g, x => ({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[x]));

}


/* START CONNECTION */

connect();

</script>

</body>
</html>
